! ---------------------------------------------------------------------------
! NEC UNIVERGE IX シリーズ — sFlow v5 設定例（decapd フォールバック）
!
! `sflow sampling-rate <rate> out` が使えないファームウェア向けの構成。
! 標準構成 (nec-ix-sflow.conf) が使えるなら、こちらは使わないこと。
!
! 構成:
!   LAN  in  = アップロード（IPv4 そのまま）
!   WAN  in  = ダウンロード（MAP-E の IPv4-in-IPv6 でカプセル化）
!   decapd がサンプルヘッダから内側 IPv4 を取り出して 5-tuple を復元する
!
! 前提:
!   - sFlow コレクタは 1 つだけ指定できる機種であること
!   - `scripts/install.sh --with-decapd` で導入する
!     （sfacctd は udp/6345、decapd が udp/6343 を受けて中継する）
!
! 注意:
!   - 標準構成（LAN in + out）と併用してはいけない。ダウンロードが
!     「WAN in の 4in6」と「LAN out の IPv4」で二重計上される。
!   - decapd が剥がした内側 IPv4 の宛先は NAPT 前の公開アドレスなので、
!     ダウンロードを LAN ホスト単位に割り当てることはできない。
! ---------------------------------------------------------------------------

sflow agent ip <IX-IP>
sflow collector ip <COLLECTOR> 6343

! --- LAN 側: アップロードを取得 -------------------------------------------
device GigaEthernet2
  sflow sampling-rate 1000 in
  sflow max-header-size 128
  sflow polling-interval 30

! --- WAN 側: ダウンロードを取得（カプセル化されたまま） -------------------
device GigaEthernet0
  sflow sampling-rate 1000 in
  sflow max-header-size 128
  sflow polling-interval 30
