! ---------------------------------------------------------------------------
! NEC UNIVERGE IX シリーズ — sFlow v5 設定例（標準構成）
!
! 実機 (IX2207) で動作確認した内容にもとづく。モデルやファームウェアによって
! コマンド体系が異なるため、投入前に (config)# device ? と
! (config)# sflow ? で確認すること。
!
! 置き換える値:
!   <IX-IP>      ルータ自身の IP（sFlow エージェントアドレス）
!   <COLLECTOR>  コレクタの IP（sfacctd が待ち受けるアドレス）
!   6343         sFlow 標準ポート
!
! 方針: LAN ポート 1 つで in / out の両方向を採る。
!   in  = LAN ホスト → インターネット（アップロード）
!   out = インターネット → LAN ホスト（ダウンロード）
! どちらもルータの転送処理を通った後のパケットなので、NAPT 後の実アドレスが
! そのまま取れる。MAP-E のデカプセルは不要。
!
! `out` が使えないファームウェアの場合だけ nec-ix-sflow-decapd.conf を使う。
! ---------------------------------------------------------------------------

! --- エージェントとコレクタ（グローバル設定） ------------------------------
sflow agent ip <IX-IP>
sflow collector ip <COLLECTOR> 6343

! --- LAN 側: 上りと下りを両方取得 -----------------------------------------
! device は「物理ポート」を指す。インターフェース名 (GigaEthernet2.0) では
! なく GigaEthernet2 を指定する点に注意。
! sampling-rate の第 2 引数が方向。省略すると in 扱いになる。
device GigaEthernet2
  sflow sampling-rate 1000 in
  sflow sampling-rate 1000 out
  sflow max-header-size 128
  sflow polling-interval 30

! --- 保存と確認 -----------------------------------------------------------
! (config)# write memory
! # show sflow information
!
! 期待する出力:
!   Collector:
!     IP address: <COLLECTOR>, port: 6343
!   Data source information:
!     GigaEthernet2
!       Flow sampling:
!         In:  ... N samples ...        <- アップロード
!         Out: ... M samples ...        <- ダウンロード（両方が増えること）
!
! 参考: パラメータの決め方
!   sampling-rate 1000       1Gbps 回線で毎秒約125サンプル。in/out 両方なので
!                            ポートあたり最大 250 サンプル/秒
!   max-header-size 128      IPv6 のトランスポートヘッダまで収まる
!   polling-interval 30      カウンタサンプル用（本構成では未使用）
