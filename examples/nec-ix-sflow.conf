! ---------------------------------------------------------------------------
! NEC UNIVERGE IX シリーズ — sFlow v5 設定例
!
! 実機 (IX2207) で動作確認した内容にもとづく。モデルによってはコマンド体系が
! 異なるため、投入前に (config)# sflow ? と (config)# device ? で確認すること。
!
! 置き換える値:
!   <IX-IP>      ルータ自身の IP（sFlow エージェントアドレス）
!   <COLLECTOR>  コレクタの IP（decapd が待ち受けるアドレス）
!   6343         sFlow 標準ポート（decapd の --port と一致させる）
! ---------------------------------------------------------------------------

! --- エージェントとコレクタ（グローバル設定） ------------------------------
sflow agent ip <IX-IP>
sflow collector ip <COLLECTOR> 6343

! --- LAN 側: アップロードを取得 -------------------------------------------
! device は「物理ポート」を指す。インターフェース名 (GigaEthernet2.0) では
! なく GigaEthernet2 を指定する点に注意。
! sampling-rate の第 2 引数は方向 (in / out)。省略すると in 扱いになる。
device GigaEthernet2
  sflow sampling-rate 1000 in
  sflow max-header-size 128
  sflow polling-interval 30

! --- WAN 側: ダウンロードを取得 -------------------------------------------
! ダウンロードは LAN ポートにとって out 方向なので、LAN の in だけでは取れない。
! ここでは WAN の in で受けて、decapd 側で MAP-E を剥がす。
!
! 代替案: LAN 側に `sflow sampling-rate 1000 out` を足せば、ダウンロードも
! 素の IPv4 で取れ、decapd が不要になる。ただし WAN の in と併用すると
! ダウンロードが二重計上されるので、どちらか一方にすること。
device GigaEthernet0
  sflow sampling-rate 1000 in
  sflow max-header-size 128
  sflow polling-interval 30

! --- 保存と確認 -----------------------------------------------------------
! (config)# write memory
! # show sflow information
!
! 期待する出力:
!   Collector:
!     IP address: <COLLECTOR>, port: 6343
!   Statistics:
!     N outputs, 0 errors
!     M flow samples, K counter samples      <- ここが増え続ければ正常
!
! 参考: パラメータの決め方
!   sampling-rate 1000       1Gbps 回線で毎秒約125サンプル、5分で約37kサンプル相当
!   max-header-size 128      Ethernet(14)+IPv6(40)+内側IPv4(20)+トランスポート
!                            ヘッダまで収まるため、MAP-E の内側 5-tuple も取れる
!   polling-interval 30      カウンタサンプル用（本構成では未使用）
