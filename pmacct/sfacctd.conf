! ---------------------------------------------------------------------------
! sfacctd -- sFlow v5 collector feeding PostgreSQL
! Exporter: NEC UNIVERGE IX2207 (192.0.2.1)
! Collector: collector (192.0.2.10), udp/6343
!
! Deployed to /etc/pmacct/sfacctd.conf; the password placeholder is replaced
! by scripts/install.sh from .env at install time.
! ---------------------------------------------------------------------------

daemonize: false
pidfile: /run/pmacct/sfacctd.pid
! log to a file; `journalctl -u sfacctd` still shows early startup errors
logfile: /var/log/pmacct/sfacctd.log
syslog: daemon
debug: false

! --- sFlow listener -------------------------------------------------------
! The router sends sFlow straight here. With the optional decapd fallback
! (only needed when the device cannot sample egress) decapd owns udp/6343 and
! relays to 127.0.0.1:6345 instead; scripts/install.sh --with-decapd does that
! rewrite for you.
sfacctd_port: 6343

! --- PostgreSQL output plugin --------------------------------------------
plugins: pgsql
sql_host: 127.0.0.1
sql_port: 5432
sql_user: pmacct
sql_passwd: __PMACCT_PASSWORD__
sql_db: traffic
sql_table: flows
sql_table_version: 9
! sql_table_type defaults to 'original' (no BGP primitives are used)
sql_data: typed

! 5-minute time-bins, aligned to the wall clock, re-flushed every 60 s so the
! dashboard stays roughly one minute behind real time.
sql_history: 5m
sql_history_roundoff: m
sql_refresh_time: 60
sql_startup_delay: 10

! --- accounting -----------------------------------------------------------
! sFlow is sampled; multiply sampled counters by the rate reported by the
! agent so `bytes`/`packets` are estimates of real traffic.
sfacctd_renormalize: true

! Force the rate if the IX2207 reports 0/unusable sampling info:
!sfacctd_ext_sampling_rate: 1000

aggregate: src_host, dst_host, src_port, dst_port, proto, tos
